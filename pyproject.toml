[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-alert"
version = "0.1.1"
description = "Rule-based Cloud, DevOps, and SRE job alerts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "pytest-socket>=0.7,<1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "types-beautifulsoup4>=4.12",
  "types-pyyaml>=6.0",
]

[project.scripts]
job-alert = "job_alert.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_alert"]

[tool.pytest.ini_options]
addopts = "-q --disable-socket"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["job_alert"]

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true
